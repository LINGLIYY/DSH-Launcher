<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSH Desktop</title>
    <style>
        :root {
            --bg-window: #f6f9fc;
            --card-bg: #ffffff;
            --primary-blue: #528ed8;
            --text-main: #222831;
            --text-secondary: #636e80;
            --border-color: #dde4ef;
            --success-green: #249457;
            --warn-orange: #e08c26;
            --error-red: #d64545;
            --safe-padding: 16px;
            --gap-block: 12px;
            --kanban-width: 340px;
            --kanban-opacity: 0.38;
            --kanban-position: rb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", system-ui, sans-serif; }
        html, body { height: 100%; }
        body { background: var(--bg-window); overflow-x: hidden; position: relative; }

        .kanban-overlay {
            position: fixed; right: 24px; bottom: 24px; width: var(--kanban-width); height: auto;
            opacity: var(--kanban-opacity); pointer-events: none; z-index: 10;
            transition: opacity 0.2s, width 0.2s, left 0.2s, right 0.2s;
        }
        .kanban-overlay.lb { right: auto; left: 24px; }

        .window-container {
            max-width: 960px; margin: 0 auto; border: 1px solid var(--border-color);
            border-radius: 8px; overflow: hidden; background: rgba(246,249,252,0.96);
            position: relative; z-index: 1; min-height: 100vh;
            display: flex; flex-direction: column;
        }

        .win-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px var(--safe-padding); border-bottom: 1px solid var(--border-color);
            background: rgba(246,249,252,0.92);
        }
        .win-header h1 { font-size: 22px; color: var(--text-main); font-weight: bold; }
        .header-right-group { display: flex; gap: 20px; align-items: center; }
        .status-indicator { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #999; }
        .status-dot.running { background: var(--success-green); }
        .status-dot.starting { background: var(--warn-orange); }
        .status-dot.error { background: var(--error-red); }

        .block { padding: 0 var(--safe-padding); margin-top: var(--gap-block); }
        .addr-bar {
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
            padding: 10px 14px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 4px;
        }
        .addr-bar .path-text { color: var(--text-main); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .addr-bar .link-url { color: var(--primary-blue); cursor: pointer; white-space: nowrap; }

        .tab-group { display: flex; gap: 0; border-bottom: 1px solid var(--border-color); width: fit-content; }
        .tab-btn { padding: 8px 18px; border: 1px solid var(--border-color); background: var(--card-bg); cursor: pointer; border-bottom: none; font-size: 14px; }
        .tab-btn.active { background: var(--primary-blue); color: white; border-color: var(--primary-blue); }

        .control-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 4px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .form-row { display: flex; align-items: center; gap: 10px; }
        .form-row label { min-width: 90px; color: var(--text-secondary); }
        .form-row input { flex: 1; padding: 6px 8px; border: 1px solid var(--border-color); border-radius: 3px; font-size: 14px; }
        .btn-small { padding: 6px 12px; border: 1px solid var(--border-color); background: var(--card-bg); cursor: pointer; }
        .btn-group { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
        .btn-primary { background: var(--primary-blue); color: white; border: 1px solid var(--primary-blue); padding: 8px 18px; cursor: pointer; }
        .btn-normal { padding: 8px 18px; border: 1px solid var(--primary-blue); background: white; color: var(--primary-blue); cursor: pointer; }
        .btn-normal:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-danger { padding: 8px 18px; border: 1px solid var(--error-red); background: white; color: var(--error-red); cursor: pointer; }

        .log-wrap { display: flex; flex-direction: column; margin-top: var(--gap-block); padding: 0 var(--safe-padding); flex: 1; min-height: 220px; }
        .log-box { flex: 1; border: 1px solid var(--border-color); background: var(--card-bg); padding: 8px; overflow-y: auto; white-space: pre-wrap; font-family: Consolas, monospace; font-size: 13px; line-height: 1.5; }
        .log-footer { display: flex; justify-content: flex-end; gap: 16px; padding: 6px 4px; color: var(--text-secondary); }
        .log-clear { cursor: pointer; }
        .log-ready { color: var(--success-green); }
        .log-start { color: var(--warn-orange); }
        .log-stop { color: var(--text-secondary); }
        .log-err { color: var(--error-red); }
        .log-info { color: var(--text-main); }

        .setting-toggle { padding: 4px 12px; border: 1px solid var(--border-color); background: #fff; cursor: pointer; }
        .setting-panel { position: fixed; top: 60px; right: 20px; width: 280px; background: #fff; border: 1px solid var(--border-color); border-radius: 6px; padding: 16px; z-index: 999; display: none; }
        .setting-panel.show { display: block; }
        .setting-panel h3 { margin-bottom: 14px; font-size: 15px; color: var(--text-main); }
        .setting-item { margin-bottom: 12px; }
        .setting-item label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
        .setting-item input[type="range"] { width: 100%; }
        .setting-desc { font-size: 12px; color: #999; }
        .setting-btn-row { display: flex; gap: 8px; margin-top: 16px; }
        .setting-btn-row button { flex: 1; padding: 6px; cursor: pointer; }
        .pos-btn.active { background: var(--primary-blue); color: white; border-color: var(--primary-blue); }

        #sessionPanel { flex: 1; display: none; flex-direction: column; padding: 0 var(--safe-padding); margin-top: var(--gap-block); gap: var(--gap-block); }
        #sessionPanel.active { display: flex; }
        #consolePanel.active { display: block; }
        #consolePanel { display: none; }
        .session-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .session-toolbar input { flex: 1; min-width: 180px; padding: 6px 8px; border: 1px solid var(--border-color); border-radius: 3px; }
        .session-body { flex: 1; display: flex; gap: 12px; min-height: 300px; }
        .session-tree { width: 300px; min-width: 220px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 4px; overflow-y: auto; padding: 8px; }
        .session-tree .ws-group { margin-bottom: 8px; }
        .session-tree .ws-title { font-weight: bold; color: var(--text-main); padding: 4px 2px; font-size: 13px; }
        .session-item { padding: 6px 8px; cursor: pointer; border-radius: 3px; color: var(--text-main); font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
        .session-item:hover { background: #eef4fb; }
        .session-item.active { background: #e3edfb; }
        .session-item .meta { color: var(--text-secondary); font-size: 11px; }
        .session-detail { flex: 1; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 4px; padding: 16px; overflow-y: auto; font-size: 14px; line-height: 1.6; }
        .detail-user { color: var(--primary-blue); margin-bottom: 12px; white-space: pre-wrap; }
        .detail-assistant { color: var(--text-main); margin-bottom: 12px; white-space: pre-wrap; }
        .detail-tool { color: #9a6a1a; margin-bottom: 8px; white-space: pre-wrap; font-family: Consolas, monospace; font-size: 13px; }
        .detail-result { color: var(--text-secondary); margin-bottom: 10px; white-space: pre-wrap; font-size: 13px; }
        .detail-info { color: var(--text-secondary); }
    </style>
</head>
<body>
    <img src="kanban-background.png" class="kanban-overlay" id="kanbanImg" alt="">

    <div class="setting-panel" id="settingPanel">
        <h3>看板娘设置</h3>
        <div class="setting-item">
            <label>显示尺寸 <span id="sizeValue">340px</span></label>
            <input type="range" id="sizeSlider" min="120" max="460" value="340">
            <div class="setting-desc">调整角色画面宽度</div>
        </div>
        <div class="setting-item">
            <label>透明度 <span id="opacityValue">0.38</span></label>
            <input type="range" id="opacitySlider" min="10" max="60" value="38">
            <div class="setting-desc">数值越高画面越清晰</div>
        </div>
        <div class="setting-item">
            <label>显示位置</label>
            <div style="display:flex;gap:6px;">
                <button class="btn-small pos-btn active" data-pos="rb">右下角</button>
                <button class="btn-small pos-btn" data-pos="lb">左下角</button>
            </div>
        </div>
        <div class="setting-btn-row">
            <button class="btn-normal" id="resetSetting">恢复默认</button>
            <button class="btn-primary" id="closeSetting">关闭</button>
        </div>
    </div>

    <div class="window-container">
        <div class="win-header">
            <h1>DSH Desktop</h1>
            <div class="header-right-group">
                <button class="setting-toggle" id="openSetting">设置</button>
                <div class="status-indicator">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">已停止</span>
                </div>
            </div>
        </div>

        <div class="block">
            <div class="addr-bar">
                <span class="path-text" id="pathText">工作区：</span>
                <span class="link-url" id="urlLink">http://127.0.0.1:7602/</span>
            </div>
        </div>

        <div class="block">
            <div class="tab-group">
                <button class="tab-btn active" data-tab="console">控制台</button>
                <button class="tab-btn" data-tab="session">会话管理</button>
            </div>
        </div>

        <div id="consolePanel" class="active">
            <div class="block">
                <div class="control-card">
                    <div class="form-row">
                        <label>工作区目录</label>
                        <input type="text" id="workspaceInput" value="">
                        <button class="btn-small" id="browseBtn">浏览...</button>
                    </div>
                    <div class="form-row">
                        <label>地址</label>
                        <input type="text" id="addrInput" readonly>
                        <button class="btn-small" id="openBtn">打开</button>
                    </div>
                    <div class="btn-group">
                        <button class="btn-primary" id="startBtn">启动 Harness</button>
                        <button class="btn-danger" id="stopBtn" disabled>停止 Harness</button>
                        <button class="btn-normal" id="openBrowserBtn">打开浏览器</button>
                        <button class="btn-normal" id="openLogsBtn">打开日志目录</button>
                        <button class="btn-normal" id="hideBtn">隐藏到托盘</button>
                    </div>
                </div>
            </div>
            <div class="log-wrap">
                <div class="log-box" id="logContent"></div>
                <div class="log-footer">
                    <span class="log-clear" id="clearLog">清空日志</span>
                    <span id="logLineCount">0</span>
                </div>
            </div>
        </div>

        <div id="sessionPanel">
            <div class="session-toolbar">
                <button class="btn-small" id="refreshSessions">刷新</button>
                <button class="btn-danger" id="deleteSession">删除会话</button>
                <input type="text" id="searchSessions" placeholder="搜索会话标题 / 工作区">
            </div>
            <div class="session-body">
                <div class="session-tree" id="sessionTree"></div>
                <div class="session-detail" id="sessionDetail">选择左侧会话查看对话内容</div>
            </div>
        </div>
    </div>

    <script>
        const invoke = window.__TAURI__.core.invoke;
        const listen = window.__TAURI__.event.listen;

        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const logContent = document.getElementById('logContent');
        const logCount = document.getElementById('logLineCount');
        let logLines = 0;
        let selectedSessionId = null;

        function appendLog(level, text) {
            const span = document.createElement('span');
            span.className = 'log-' + (level === 'err' ? 'err' : (level === 'ready' ? 'ready' : (level === 'start' ? 'start' : 'info')));
            span.textContent = text + '\n';
            logContent.appendChild(span);
            logContent.scrollTop = logContent.scrollHeight;
            logLines++;
            logCount.textContent = logLines;
        }

        function applyStatus(status, text) {
            const map = {
                stopped: ['', '已停止', '#999'],
                starting: ['starting', '正在启动…', ''],
                ready: ['running', '运行中', ''],
                error: ['error', '异常 / 超时', ''],
            };
            const conf = map[status] || map.stopped;
            statusDot.className = 'status-dot ' + conf[0];
            statusText.textContent = text || conf[1];
            const running = status === 'ready' || status === 'starting';
            startBtn.disabled = running;
            stopBtn.disabled = !running;
        }

        async function refreshState() {
            try {
                const s = await invoke('get_state');
                document.getElementById('workspaceInput').value = s.workspace;
                document.getElementById('addrInput').value = s.url;
                document.getElementById('pathText').textContent = '工作区：' + s.workspace;
                document.getElementById('urlLink').textContent = s.url;
                applyStatus(s.status);
                try {
                    const sessions = await invoke('list_sessions', { filter: '' });
                    appendLog('info', '自检: 会话 ' + sessions.length + ' 个');
                } catch (e) {
                    appendLog('err', '自检会话失败: ' + String(e));
                }
            } catch (e) {
                appendLog('err', String(e));
            }
        }

        listen('harness-status', (e) => applyStatus(e.payload.status, e.payload.text));
        listen('harness-log', (e) => appendLog(e.payload.level, e.payload.text));

        document.getElementById('startBtn').onclick = async () => {
            try {
                const ws = document.getElementById('workspaceInput').value;
                await invoke('start_harness', { workspace: ws, port: 7602 });
            } catch (e) { appendLog('err', String(e)); }
        };
        document.getElementById('stopBtn').onclick = async () => {
            try { await invoke('stop_harness'); } catch (e) { appendLog('err', String(e)); }
        };
        document.getElementById('openBrowserBtn').onclick = async () => {
            try { await invoke('open_browser'); } catch (e) { appendLog('err', String(e)); }
        };
        document.getElementById('openBtn').onclick = async () => {
            try { await invoke('open_browser'); } catch (e) { appendLog('err', String(e)); }
        };
        document.getElementById('urlLink').onclick = async () => {
            try { await invoke('open_browser'); } catch (e) { appendLog('err', String(e)); }
        };
        document.getElementById('openLogsBtn').onclick = async () => {
            try { await invoke('open_logs_dir'); } catch (e) { appendLog('err', String(e)); }
        };
        document.getElementById('hideBtn').onclick = async () => {
            try { await invoke('hide_to_tray'); } catch (e) { appendLog('err', String(e)); }
        };
        document.getElementById('browseBtn').onclick = async () => {
            try {
                const p = await invoke('pick_workspace');
                if (p) {
                    document.getElementById('workspaceInput').value = p;
                    await invoke('set_workspace', { path: p });
                    refreshState();
                }
            } catch (e) { appendLog('err', String(e)); }
        };
        document.getElementById('clearLog').onclick = () => {
            logContent.innerHTML = '';
            logLines = 0;
            logCount.textContent = '0';
        };

        document.querySelectorAll('.tab-btn').forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const target = tab.dataset.tab;
                document.getElementById('consolePanel').classList.toggle('active', target === 'console');
                document.getElementById('sessionPanel').classList.toggle('active', target === 'session');
                if (target === 'session') refreshSessions();
            };
        });

        function formatTime(ms) {
            if (!ms) return '';
            const d = new Date(ms);
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        }
        function formatSize(b) {
            if (b < 1024) return b + ' B';
            if (b < 1048576) return (b / 1024).toFixed(0) + ' KB';
            return (b / 1048576).toFixed(1) + ' MB';
        }

        async function refreshSessions() {
            const tree = document.getElementById('sessionTree');
            tree.innerHTML = '';
            try {
                const filter = document.getElementById('searchSessions').value.trim();
                const sessions = await invoke('list_sessions', { filter });
                const byWs = {};
                sessions.forEach(s => {
                    (byWs[s.workspace] = byWs[s.workspace] || []).push(s);
                });
                Object.keys(byWs).sort().forEach(ws => {
                    const group = document.createElement('div');
                    group.className = 'ws-group';
                    const title = document.createElement('div');
                    title.className = 'ws-title';
                    title.textContent = ws;
                    group.appendChild(title);
                    byWs[ws].forEach(s => {
                        const item = document.createElement('div');
                        item.className = 'session-item' + (s.id === selectedSessionId ? ' active' : '');
                        item.dataset.id = s.id;
                        const t = document.createElement('div');
                        t.textContent = s.title || '未命名会话';
                        const meta = document.createElement('div');
                        meta.className = 'meta';
                        meta.textContent = formatTime(s.mtime_ms) + ' · ' + formatSize(s.size);
                        item.appendChild(t);
                        item.appendChild(meta);
                        item.onclick = () => loadSession(s.id, item);
                        group.appendChild(item);
                    });
                    tree.appendChild(group);
                });
                if (Object.keys(byWs).length === 0) {
                    tree.textContent = '未找到会话';
                }
            } catch (e) {
                tree.textContent = String(e);
            }
        }

        async function loadSession(id, item) {
            selectedSessionId = id;
            document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
            if (item) item.classList.add('active');
            const detail = document.getElementById('sessionDetail');
            detail.innerHTML = '加载中…';
            try {
                const blocks = await invoke('get_session', { id });
                detail.innerHTML = '';
                if (!blocks || blocks.length === 0) {
                    detail.textContent = '（空会话）';
                    return;
                }
                blocks.forEach(b => {
                    const div = document.createElement('div');
                    div.className = 'detail-' + b.kind;
                    div.textContent = b.text;
                    detail.appendChild(div);
                });
            } catch (e) {
                detail.textContent = String(e);
            }
        }

        document.getElementById('refreshSessions').onclick = refreshSessions;
        document.getElementById('searchSessions').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') refreshSessions();
        });
        document.getElementById('deleteSession').onclick = async () => {
            if (!selectedSessionId) return;
            if (!confirm('确定删除该会话吗？会移入 sessions_trash 备份目录，可恢复。')) return;
            try {
                await invoke('delete_session', { id: selectedSessionId });
                selectedSessionId = null;
                document.getElementById('sessionDetail').textContent = '会话已移入备份';
                refreshSessions();
            } catch (e) {
                document.getElementById('sessionDetail').textContent = String(e);
            }
        };

        (function initKanban() {
            const kanbanImg = document.getElementById('kanbanImg');
            const settingPanel = document.getElementById('settingPanel');
            const sizeSlider = document.getElementById('sizeSlider');
            const opacitySlider = document.getElementById('opacitySlider');
            const sizeValueText = document.getElementById('sizeValue');
            const opacityValueText = document.getElementById('opacityValue');
            const posButtons = document.querySelectorAll('.pos-btn');
            const DEFAULT_CONFIG = { width: 340, opacity: 0.38, position: 'rb' };
            let currentConfig = { ...DEFAULT_CONFIG };
            try {
                const saved = localStorage.getItem('dsh_kanban_config');
                if (saved) currentConfig = JSON.parse(saved);
            } catch (e) {}
            function applyConfig() {
                document.documentElement.style.setProperty('--kanban-width', currentConfig.width + 'px');
                document.documentElement.style.setProperty('--kanban-opacity', currentConfig.opacity);
                kanbanImg.classList.toggle('lb', currentConfig.position === 'lb');
            }
            function syncUI() {
                sizeSlider.value = currentConfig.width;
                opacitySlider.value = Math.round(currentConfig.opacity * 100);
                sizeValueText.textContent = currentConfig.width + 'px';
                opacityValueText.textContent = currentConfig.opacity.toFixed(2);
                posButtons.forEach(b => b.classList.toggle('active', b.dataset.pos === currentConfig.position));
            }
            function saveConfig() { localStorage.setItem('dsh_kanban_config', JSON.stringify(currentConfig)); }
            document.getElementById('openSetting').onclick = () => settingPanel.classList.toggle('show');
            document.getElementById('closeSetting').onclick = () => settingPanel.classList.remove('show');
            sizeSlider.oninput = () => { currentConfig.width = Number(sizeSlider.value); sizeValueText.textContent = currentConfig.width + 'px'; applyConfig(); };
            opacitySlider.oninput = () => { currentConfig.opacity = Number(opacitySlider.value) / 100; opacityValueText.textContent = currentConfig.opacity.toFixed(2); applyConfig(); };
            posButtons.forEach(btn => btn.onclick = () => { currentConfig.position = btn.dataset.pos; applyConfig(); syncUI(); saveConfig(); });
            document.getElementById('resetSetting').onclick = () => { currentConfig = { ...DEFAULT_CONFIG }; applyConfig(); syncUI(); saveConfig(); };
            sizeSlider.onchange = saveConfig;
            opacitySlider.onchange = saveConfig;
            applyConfig();
            syncUI();
        })();

        refreshState();
    </script>
</body>
</html>
