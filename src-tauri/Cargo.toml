[package]
name = "dsh-launcher"
version = "1.0.0"
description = "DSH Launcher - lightweight Tauri launcher for DeepSeek Harness"
authors = ["LINGLIYY"]
edition = "2021"

[lib]
name = "dsh_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
zstd = "0.13"
anyhow = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
