<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>DSH Desktop 设置</title>
  <link rel="stylesheet" href="./settings.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>DSH Desktop 设置</h1>
      <span id="ver" class="muted"></span>
    </div>
  </header>

  <main>
    <!-- 服务器状态 -->
    <section class="card">
      <h2>服务器</h2>
      <div class="status-row">
        <span id="statusDot" class="dot idle"></span>
        <span id="statusText" class="status-text">未运行</span>
        <span id="statusMeta" class="muted"></span>
      </div>
      <div class="actions">
        <button id="btnStart" class="primary">启动</button>
        <button id="btnRestart">重启</button>
        <button id="btnStop">停止</button>
        <button id="btnOpen" class="ghost">在浏览器打开</button>
      </div>
      <label class="field">
        <span>附加模式</span>
        <select id="attachMode">
          <option value="auto">自动（首选端口已有 dsh web 则复用）</option>
          <option value="always-spawn">总是启动自己的实例</option>
        </select>
      </label>
      <label class="field">
        <span>首选端口</span>
        <input id="preferredPort" type="number" min="1" max="65535" />
      </label>
    </section>

    <!-- 凭据与环境 -->
    <section class="card">
      <h2>凭据与环境</h2>
      <p class="hint">这些值会注入到 dsh web 子进程的环境变量。模型/代理人格等偏好请在官方界面里配置。</p>
      <label class="field">
        <span>DEEPSEEK_API_KEY</span>
        <input id="apiKey" type="password" placeholder="sk-…（也可在官方界面配置凭据）" autocomplete="off" />
      </label>
      <label class="field">
        <span>DEEPSEEK_BASE_URL</span>
        <input id="baseUrl" type="text" placeholder="可选，如 https://api.deepseek.com" />
      </label>
      <label class="field">
        <span>DSH_HOME（数据目录）</span>
        <div class="path-row">
          <input id="dshHome" type="text" placeholder="留空用默认 ~/.dsh" />
          <button id="btnDshHome" class="ghost">浏览…</button>
        </div>
      </label>
      <label class="field">
        <span>工作目录（子进程 cwd）</span>
        <div class="path-row">
          <input id="workspace" type="text" placeholder="留空用 <userData>/workspace" />
          <button id="btnWorkspace" class="ghost">浏览…</button>
        </div>
      </label>
      <label class="field">
        <span>DSH_TOOLS_MODE</span>
        <select id="toolsMode">
          <option value="">默认（不设置）</option>
          <option value="native">native</option>
          <option value="code">code</option>
          <option value="both">both</option>
        </select>
      </label>
      <label class="check">
        <input id="disableTelemetry" type="checkbox" />
        <span>关闭遥测（DSH_TELEMETRY_DISABLED=1）</span>
      </label>
      <label class="check">
        <input id="closeToTray" type="checkbox" />
        <span>关闭窗口时最小化到托盘（服务器保持运行）</span>
      </label>
    </section>

    <section class="card">
      <div class="save-row">
        <button id="btnSave" class="primary">保存设置</button>
        <span id="toast" class="muted"></span>
      </div>
    </section>

    <!-- 日志 -->
    <section class="card">
      <div class="log-head">
        <h2>服务器日志</h2>
        <div>
          <button id="btnCopy" class="ghost">复制</button>
          <button id="btnClear" class="ghost">清空</button>
        </div>
      </div>
      <pre id="log" class="log"></pre>
    </section>
  </main>

  <footer class="foot muted" id="foot"></footer>
  <script src="./settings.js"></script>
</body>
</html>
